<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OftalmIA">
<meta name="theme-color" content="#0d0f14">
<title>OftalmIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--surface:#161921;--surface2:#1e2230;--border:rgba(255,255,255,0.07);--accent:#7eb8b4;--accent2:#c4a882;--text:#e8eaf0;--text2:#8a8fa8;--text3:#4a5060;--danger:#c47a7a;--success:#7ab89e;--warn:#c4a87a;--blue:#7a9ec4;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(126,184,180,0.06) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 80% 80%,rgba(196,168,130,0.04) 0%,transparent 60%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:'DM Serif Display',serif;font-size:22px;letter-spacing:-0.3px}
.logo em{color:var(--accent);font-style:italic}
.logo-sub{font-size:10px;font-weight:400;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{flex:1;padding:14px 20px 90px;overflow-y:auto}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(22,25,33,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer;color:var(--text3);font-size:10px;letter-spacing:0.5px;border:none;background:transparent;font-family:'DM Sans',sans-serif;transition:color 0.2s}
.nav-item .ni{font-size:19px;line-height:1}
.nav-item.active{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel-title{font-family:'DM Serif Display',serif;font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
input,textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;outline:none;transition:border-color 0.2s;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:none;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{padding:5px 10px;border-radius:20px;border:1px solid var(--border);font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s;background:var(--surface2);user-select:none}
.tag.sel{background:var(--accent);border-color:var(--accent);color:#0d0f14}
.tag.custom-add{border-style:dashed;color:var(--text3)}
.pills{display:flex;gap:6px}
.pill{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;text-align:center;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.pill.sel{background:var(--accent);border-color:var(--accent);color:#0d0f14}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;margin-bottom:6px}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--accent);color:#0d0f14}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-sm{padding:6px 12px;font-size:12px;width:auto;border-radius:8px;margin-bottom:0}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color 0.18s;position:relative;overflow:hidden}
.card:hover{border-color:var(--accent)}
.card .c-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.card .c-name{font-family:'DM Serif Display',serif;font-size:17px;margin:2px 0}
.card .c-meta{font-size:12px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.b-teal{background:rgba(126,184,180,0.12);color:var(--accent)}
.b-gold{background:rgba(196,168,130,0.12);color:var(--accent2)}
.b-red{background:rgba(196,122,122,0.12);color:var(--danger)}
.b-green{background:rgba(122,184,158,0.12);color:var(--success)}
.slabel{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin:16px 0 8px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 12px;color:var(--text2);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0}
.irow{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.irow:last-child{border-bottom:none}
.ikey{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.8px;flex-shrink:0;padding-right:10px}
.ival{color:var(--text);text-align:right;max-width:65%}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.gitem{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--surface2);border:1px solid var(--border);cursor:pointer}
.gitem img{width:100%;height:100%;object-fit:cover}
.gitem-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:20px 8px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.gadd{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--text2);font-size:12px;transition:all 0.2s;background:transparent;font-family:'DM Sans',sans-serif}
.gadd:active{border-color:var(--accent);color:var(--accent)}
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cslot{border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);font-size:12px;cursor:pointer;gap:8px;position:relative}
.cslot img{width:100%;height:100%;object-fit:cover}
.clabel{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);font-size:10px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.rem-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.rem-bar{width:4px;border-radius:4px;align-self:stretch;flex-shrink:0}
.rem-body{flex:1;min-width:0}
.rem-title{font-size:14px;font-weight:500}
.rem-meta{font-size:12px;color:var(--text2);margin-top:2px}
.rem-days{font-size:20px;font-family:'DM Serif Display',serif;line-height:1;text-align:center}
.rem-complete{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0;font-size:14px}
.rem-complete:active{background:var(--success);border-color:var(--success);color:#0d0f14}
#chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 155px)}
.chat-msgs{flex:1;overflow-y:auto;padding:4px 0;scrollbar-width:none}
.chat-msgs::-webkit-scrollbar{display:none}
.msg{margin-bottom:12px;animation:fadeUp .25s ease}
.msg-ai .bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:14px;line-height:1.6;max-width:90%}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .bubble{background:var(--accent);color:#0d0f14;border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:14px;max-width:85%}
.msg-lbl{font-size:10px;color:var(--text3);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.chat-in-wrap{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.chat-in-wrap input{flex:1;border-radius:20px;padding:11px 16px}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);border:none;color:#0d0f14;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.typing{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6)}40%{transform:scale(1)}}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:20px 20px max(24px,env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 18px}
.sheet-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:18px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lightbox img{max-width:94vw;max-height:80dvh;border-radius:12px;object-fit:contain}
.lb-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-del{background:rgba(196,122,122,.2);border:1px solid rgba(196,122,122,.4);color:var(--danger);padding:8px 20px;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px}
.dtabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;margin-top:4px}
.dtab{flex:1;padding:10px 4px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.dtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.empty{text-align:center;padding:36px 20px;color:var(--text3)}
.empty .ei{font-size:32px;margin-bottom:8px;opacity:.5}
.empty p{font-size:13px}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:9px 18px;font-size:13px;color:var(--text);opacity:0;transition:all .3s;z-index:300;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
.hidden{display:none!important}
a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="logo">Oftalm<em>IA</em></div>
      <div class="logo-sub">Asistente Clínico</div>
    </div>
    <div class="status-dot"></div>
  </header>
  <main id="main"></main>
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="nav('chat')" id="nb-chat"><span class="ni">💬</span>Chat</button>
    <button class="nav-item" onclick="nav('pacientes')" id="nb-pacientes"><span class="ni">👁</span>Pacientes</button>
    <button class="nav-item" onclick="nav('nuevo')" id="nb-nuevo"><span class="ni">＋</span>Añadir</button>
    <button class="nav-item" onclick="nav('buscar')" id="nb-buscar"><span class="ni">🔍</span>Buscar</button>
    <button class="nav-item" onclick="nav('agenda')" id="nb-agenda"><span class="ni">🔔</span>Agenda</button>
  </nav>
</div>
<div id="toast"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbx8vMyBP6bBUa8oinsb9b_O9yJV2Tfz-lB0CXccGc7XRSBM--mmgm3kWV_0QXTYjcHQnA/exec";
const API_KEY="oftalmologia2026";
const CLAUDE_API="https://api.anthropic.com/v1/messages";
const IMG_KEY="oftalmia_images_v1";
const REM_KEY="oftalmia_reminders_v1";
const DIAGS=["Tumor palpebral","Chalazion","Blefaritis","Dermatocalasia","Ptosis","Obstrucción CNL","Entropión","Ectropión","Triquiasis","Parálisis facial","Ptosis ceja","Tumor orbitario","Inflamación orbitaria","Catarata","Uveítis","Úlcera corneal","Absceso corneal","Endoftalmitis","Pterigion"];
const PROCS=["Facoemulsificación","Escisión tumor y reconstrucción","Reinserción aponeurosis vía anterior","Reinserción aponeurosis vía posterior","Mullerectomía","Blefaroplastia superior","Tira tarsal","Cirugía pterigion"];
const REM_TYPES=["Llamada","Revisión presencial","Videoconsulta","WhatsApp","Cura","Retirada de puntos","Otro"];
let chatHistory=[],selDiags=[],selProcs=[],pillState={};

function loadImages(){try{return JSON.parse(localStorage.getItem(IMG_KEY)||'{}')}catch{return{}}}
function saveImages(d){localStorage.setItem(IMG_KEY,JSON.stringify(d))}
function loadReminders(){try{return JSON.parse(localStorage.getItem(REM_KEY)||'[]')}catch{return[]}}
function saveReminders(r){localStorage.setItem(REM_KEY,JSON.stringify(r))}
function genId(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function fmtDate(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'})}
function daysUntil(iso){if(!iso)return null;return Math.ceil((new Date(iso)-new Date())/86400000)}

async function sheets(params){
  const url=new URL(API_URL);
  url.searchParams.set('key',API_KEY);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));
  try{const r=await fetch(url.toString());return await r.json()}
  catch(e){return{error:e.toString()}}
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show '+type;
  setTimeout(()=>t.className='',2800);
}

function nav(name){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nb=document.getElementById('nb-'+name);if(nb)nb.classList.add('active');
  const m=document.getElementById('main');
  if(name==='chat')renderChat(m);
  else if(name==='pacientes')renderPacientes(m);
  else if(name==='nuevo')renderNuevo(m);
  else if(name==='buscar')renderBuscar(m);
  else if(name==='agenda')renderAgenda(m);
}

// ── CHAT ────────────────────────────────────────────────────
function renderChat(m){
  m.innerHTML=`<div id="chat-wrap">
    <div class="chat-msgs" id="chat-msgs">
      <div class="msg msg-ai"><div class="msg-lbl">OftalmIA</div><div class="bubble">Hola. Soy tu asistente clínico. Puedo ayudarte a consultar pacientes, buscar casos, revisar recordatorios o añadir información.<br><br>¿En qué te ayudo?</div></div>
      ${chatHistory.map(h=>`<div class="msg ${h.role==='user'?'msg-user':'msg-ai'}">${h.role==='assistant'?'<div class="msg-lbl">OftalmIA</div>':''}<div class="bubble">${h.content.replace(/\n/g,'<br>')}</div></div>`).join('')}
    </div>
    <div class="chat-in-wrap">
      <input type="text" id="chat-in" placeholder="Escribe tu consulta..." autocomplete="off">
      <button class="send-btn" onclick="sendChat()">➤</button>
    </div>
  </div>`;
  document.getElementById('chat-in').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
  scrollChat();
}
function scrollChat(){const el=document.getElementById('chat-msgs');if(el)el.scrollTop=el.scrollHeight;}
async function sendChat(){
  const inp=document.getElementById('chat-in');
  const text=inp.value.trim();if(!text)return;
  inp.value='';
  chatHistory.push({role:'user',content:text});
  appendMsg('user',text);
  const typing=appendTyping();
  const [pacRes,epiRes]=await Promise.all([sheets({action:'getPacientes'}),sheets({action:'getEpisodios'})]);
  const rems=loadReminders().filter(r=>!r.done);
  try{
    const res=await fetch(CLAUDE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-sonnet-4-20250514',max_tokens:1000,
      system:`Eres OftalmIA, asistente clínica de una oftalmóloga oculoplástica. Datos actuales:
PACIENTES: ${JSON.stringify(pacRes.datos||[])}
EPISODIOS: ${JSON.stringify(epiRes.datos||[])}
RECORDATORIOS PENDIENTES: ${JSON.stringify(rems)}
DIAGNÓSTICOS: ${DIAGS.join(', ')}
PROCEDIMIENTOS: ${PROCS.join(', ')}
HOY: ${new Date().toLocaleDateString('es-ES')}
Responde en español, de forma concisa y clínica. No inventes datos.`,
      messages:chatHistory.map(h=>({role:h.role,content:h.content}))
    })});
    const data=await res.json();
    const reply=data.content?.[0]?.text||'Error al procesar.';
    typing.remove();chatHistory.push({role:'assistant',content:reply});appendMsg('ai',reply);
  }catch(e){typing.remove();appendMsg('ai','Error de conexión.');}
  scrollChat();
}
function appendMsg(role,content){
  const msgs=document.getElementById('chat-msgs');if(!msgs)return;
  const div=document.createElement('div');
  div.className=`msg ${role==='user'?'msg-user':'msg-ai'}`;
  div.innerHTML=`${role==='ai'?'<div class="msg-lbl">OftalmIA</div>':''}<div class="bubble">${content.replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(div);scrollChat();
}
function appendTyping(){
  const msgs=document.getElementById('chat-msgs');
  const div=document.createElement('div');
  div.className='msg msg-ai';
  div.innerHTML='<div class="msg-lbl">OftalmIA</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(div);scrollChat();return div;
}

// ── PACIENTES ────────────────────────────────────────────────
async function renderPacientes(m){
  m.innerHTML=`<div class="panel"><p style="color:var(--text3)">Cargando...</p></div>`;
  const res=await sheets({action:'getPacientes'});
  const pacs=res.datos||[];
  if(!pacs.length){m.innerHTML=`<div class="empty"><div class="ei">🗂</div><p>No hay pacientes registrados</p></div>`;return;}
  m.innerHTML=`<div class="slabel" style="margin-top:4px">${pacs.length} paciente${pacs.length!==1?'s':''}</div>
    ${pacs.map(p=>`<div class="card" onclick="showPaciente('${p.CIC}')">
      <div class="c-label">CIC ${p.CIC}</div>
      <div class="c-name">${p.Iniciales}</div>
      <div class="c-meta"><span>🎂 ${p.Edad} años</span><span>📅 ${p['Fecha Registro']}</span></div>
    </div>`).join('')}`;
}

// ── PATIENT DETAIL ───────────────────────────────────────────
async function showPaciente(cic){
  const m=document.getElementById('main');
  m.innerHTML=`<div class="panel"><p style="color:var(--text3)">Cargando...</p></div>`;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const [pacRes,epiRes]=await Promise.all([sheets({action:'getPacientes',cic}),sheets({action:'getEpisodios',cic})]);
  const pac=(pacRes.datos||[])[0];const epis=epiRes.datos||[];
  if(!pac){toast('Paciente no encontrado','err');nav('pacientes');return;}
  const imgs=loadImages();
  const rems=loadReminders().filter(r=>r.cic===cic&&!r.done);
  const totalImgs=Object.keys(imgs).filter(k=>k.startsWith(cic+'_')).reduce((a,k)=>a+imgs[k].length,0);
  m.innerHTML=`
    <div class="dhead">
      <button class="back-btn" onclick="nav('pacientes')">← Volver</button>
      <div style="flex:1">
        <div style="font-family:'DM Serif Display',serif;font-size:20px">${pac.Iniciales}</div>
        <div style="font-size:11px;color:var(--text3)">CIC ${cic} · ${pac.Edad} años</div>
      </div>

async function switchTab(cic,tab){
  document.querySelectorAll('.dtab').forEach((t,i)=>t.classList.toggle('active',['episodios','imagenes','notas','recordatorios'][i]===tab));
  if(!window._pac||window._pac.CIC!==cic){
    const [pacRes,epiRes]=await Promise.all([sheets({action:'getPacientes',cic}),sheets({action:'getEpisodios',cic})]);
    window._pac=(pacRes.datos||[])[0];window._epis=epiRes.datos||[];
  }
  renderTab(cic,tab);
}

        <button class="gadd" onclick="openAddImage('${cic}','standalone','post')">📷<span>Post-op</span></button>
      </div>

              ${n.Tag?`<span class="badge b-gold">#${n.Tag}</span>`:''}
            </div>

          </div>`).join('')}`;

    sheets({action:'getRecordatorios',cic}).then(res=>{
      const allRems=res.datos||[];

function remCardSheets(r,cic){

    ${d!==null?`<div style="text-align:center"><div class="rem-days" style="color:${col}">${d<0?Math.abs(d)+'d':d===0?'Hoy':d+'d'}</div><div style="font-size:10px;color:var(--text3)">${d<0?'vencido':'rest.'}</div></div>`:''}

}

function toggleTag(el,type){
  el.classList.toggle('sel');const v=el.textContent;
  if(type==='diag')selDiags=el.classList.contains('sel')?[...selDiags,v]:selDiags.filter(d=>d!==v);
  else selProcs=el.classList.contains('sel')?[...selProcs,v]:selProcs.filter(p=>p!==v);
}
function addCustomTag(type){
  const v=prompt(type==='diag'?'Diagnóstico personalizado:':'Procedimiento personalizado:');
  if(!v?.trim())return;
  const wrap=document.getElementById(type==='diag'?'diag-tags':'proc-tags');
  const tag=document.createElement('div');tag.className='tag sel';tag.textContent=v.trim();
  tag.onclick=function(){toggleTag(this,type)};
  wrap.insertBefore(tag,wrap.querySelector('.custom-add'));
  if(type==='diag')selDiags.push(v.trim());else selProcs.push(v.trim());
}
function selPill(el,group){
  document.querySelectorAll(`.pill[data-v]`).forEach(p=>{if(p.closest('.pills')===el.closest('.pills'))p.classList.remove('sel');});
  el.classList.add('sel');pillState[group]=el.dataset.v;

}

// ── IMÁGENES ─────────────────────────────────────────────────
function openAddImage(cic,episodioId,type){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.style.cssText='position:fixed;top:-100px;left:-100px;opacity:0;';
  document.body.appendChild(inp);
  inp.onchange=(e)=>{
    const file=e.target.files[0];
    document.body.removeChild(inp);
    if(!file)return;
    toast('Procesando imagen...','');
    // Redimensionar antes de guardar para evitar problemas de memoria en Safari iOS
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const MAX=1200;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const src=canvas.toDataURL('image/jpeg',0.82);
      const imgs=loadImages();const key=cic+'_'+episodioId;if(!imgs[key])imgs[key]=[];
      const label=(type==='pre'?'Pre-op':'Post-op')+' '+new Date().toLocaleDateString('es-ES');
      imgs[key].push({id:genId(),src,type,label,date:new Date().toISOString()});
      saveImages(imgs);toast('Imagen guardada ✓','ok');
      if(episodioId==='standalone')showPaciente(cic);else showEpisodio(episodioId,cic);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast('Error al cargar imagen','err');};
    img.src=url;
  };
  inp.click();
}
function openLightbox(cic,imgId){openLightboxEp(cic,'standalone',imgId);}
function openLightboxEp(cic,epId,imgId){
  const imgs=loadImages();const key=cic+'_'+epId;
  const img=(imgs[key]||[]).find(i=>i.id===imgId);if(!img)return;
  const lb=document.createElement('div');lb.className='lightbox';
  lb.innerHTML=`<button class="lb-close" onclick="this.closest('.lightbox').remove()">✕</button>
    <img src="${img.src}" alt="${img.label}">
    <div style="color:var(--text2);font-size:13px">${img.label} · ${fmtDate(img.date)}</div>
    <button class="lb-del" onclick="deleteImage('${cic}','${epId}','${imgId}')">Eliminar imagen</button>`;
  document.body.appendChild(lb);
}
function deleteImage(cic,epId,imgId){
  if(!confirm('¿Eliminar imagen?'))return;
  const imgs=loadImages();const key=cic+'_'+epId;
  imgs[key]=(imgs[key]||[]).filter(i=>i.id!==imgId);

  if(epId==='standalone')showPaciente(cic);else showEpisodio(epId,cic);
}

function openAddNota(cic){
  const s=document.createElement('div');s.className='sheet-backdrop';
  s.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div><div class="sheet-title">Nueva nota clínica</div>
    <div class="field"><label>Nota</label><textarea id="nota-txt" placeholder="Hallazgos, evolución, indicaciones..." style="min-height:100px"></textarea></div>
    <div class="field"><label>Etiqueta</label><select id="nota-tag">
      <option value="">Sin etiqueta</option>
      <option value="preoperatorio">preoperatorio</option>
      <option value="postoperatorio">postoperatorio</option>
      <option value="seguimiento">seguimiento</option>
      <option value="incidencia">incidencia</option>
      <option value="consulta">consulta</option>
    </select></div>
    <button class="btn btn-primary" onclick="submitNota('${cic}')">Guardar nota</button>
    <button class="btn btn-ghost" onclick="this.closest('.sheet-backdrop').remove()">Cancelar</button>
  </div>`;
  s.onclick=()=>s.remove();document.body.appendChild(s);
}
async function submitNota(cic){
  const txt=document.getElementById('nota-txt').value.trim();
  if(!txt){toast('Escribe algo','err');return;}
  const tag=document.getElementById('nota-tag').value;
  const res=await sheets({action:'addNota',cic,texto:txt,tag,fecha:new Date().toISOString()});
  if(res.ok){toast('Nota guardada ✓','ok');document.querySelector('.sheet-backdrop')?.remove();switchTab(cic,'notas');}
  else toast('Error al guardar nota','err');
}
async function deleteNota(cic,id){
  if(!confirm('¿Eliminar nota?'))return;
  const res=await sheets({action:'deleteNota',id});
  if(res.ok){toast('Nota eliminada','ok');switchTab(cic,'notas');}
  else toast('Error al eliminar nota','err');
}

// ── RECORDATORIOS (Google Sheets) ─────────────────────────────
function openAddRecordatorio(cic,ini){
  const s=document.createElement('div');s.className='sheet-backdrop';
  s.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div><div class="sheet-title">Nuevo recordatorio</div>
    <div class="field"><label>Descripción</label><input type="text" id="rem-title" placeholder="Ej: Revisión 1 semana post-op"></div>
    <div class="field"><label>Fecha</label><input type="date" id="rem-date"></div>
    <div class="field"><label>Tipo</label><select id="rem-type">${REM_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <button class="btn btn-primary" onclick="submitRecordatorio('${cic}','${ini}')">Guardar</button>
    <button class="btn btn-ghost" onclick="this.closest('.sheet-backdrop').remove()">Cancelar</button>
  </div>`;
  s.onclick=()=>s.remove();document.body.appendChild(s);
}
async function submitRecordatorio(cic,ini){
  const titulo=document.getElementById('rem-title').value.trim();
  if(!titulo){toast('Añade una descripción','err');return;}
  const res=await sheets({action:'addRecordatorio',cic,iniciales:ini,titulo,fecha:document.getElementById('rem-date').value,tipo:document.getElementById('rem-type').value});
  if(res.ok){toast('Recordatorio guardado ✓','ok');document.querySelector('.sheet-backdrop')?.remove();switchTab(cic,'recordatorios');}
  else toast('Error al guardar recordatorio','err');
}
async function completeReminder(id,cic){
  const res=await sheets({action:'updateRecordatorio',id});
  if(res.ok){toast('Completado ✓','ok');switchTab(cic,'recordatorios');}
  else toast('Error','err');
}

// ── BUSCAR ───────────────────────────────────────────────────
function renderBuscar(m){
  m.innerHTML=`<div class="panel">
    <div class="panel-title">🔍 Buscar episodios</div>
    <div class="field"><label>Por CIC</label><input type="text" id="b-cic" placeholder="Número CIC"></div>
    <div class="field"><label>Por diagnóstico</label><select id="b-diag"><option value="">— Todos —</option>${DIAGS.map(d=>`<option>${d}</option>`).join('')}</select></div>
    <div class="field"><label>Por procedimiento</label><select id="b-proc"><option value="">— Todos —</option>${PROCS.map(p=>`<option>${p}</option>`).join('')}</select></div>
    <button class="btn btn-primary" onclick="runBuscar()">Buscar</button>
  </div><div id="buscar-res"></div>`;
}
async function runBuscar(){
  const cic=document.getElementById('b-cic').value.trim();
  const diag=document.getElementById('b-diag').value;
  const proc=document.getElementById('b-proc').value;
  const res=document.getElementById('buscar-res');
  res.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3)">Buscando...</div>`;
  const params={action:'getEpisodios'};
  if(cic)params.cic=cic;if(diag)params.diagnostico=diag;if(proc)params.procedimiento=proc;
  const r=await sheets(params);const datos=r.datos||[];
  if(!datos.length){res.innerHTML=`<div class="empty"><div class="ei">🔍</div><p>Sin resultados</p></div>`;return;}
  res.innerHTML=`<div class="slabel">${datos.length} resultado${datos.length!==1?'s':''}</div>
    ${datos.map(ep=>`<div class="card" onclick="showEpisodio('${ep.ID_episodio}','${ep.CIC}')">
      <div class="c-label">CIC ${ep.CIC} · ${ep.Iniciales}</div>
      <div class="c-name" style="font-size:15px">${ep.Diagnosticos||'—'}</div>
      <div class="c-meta"><span>👁 ${ep.Ojo||'—'}</span><span>🔪 ${ep['Fecha Cirugia']||'—'}</span>
      ${ep.Procedimientos?`<span class="badge b-teal">${ep.Procedimientos.split(',')[0]}</span>`:''}</div>
    </div>`).join('')}`;
}

// ── AGENDA ───────────────────────────────────────────────────
async function renderAgenda(m){
  m.innerHTML=`<div style="text-align:center;padding:30px;color:var(--text3)">Cargando agenda...</div>`;
  const res=await sheets({action:'getRecordatorios',soloActivos:'true'});
  const rems=(res.datos||[]).sort((a,b)=>new Date(a.Fecha)-new Date(b.Fecha));
  const overdue=rems.filter(r=>{const d=daysUntil(r.Fecha);return d!==null&&d<0;});
  const today=rems.filter(r=>daysUntil(r.Fecha)===0);
  const upcoming=rems.filter(r=>{const d=daysUntil(r.Fecha);return d===null||d>0;});
  function remG(r){
    const d=daysUntil(r.Fecha);
    const col=d===null?'var(--text2)':d<0?'var(--danger)':d===0?'var(--warn)':'var(--success)';
    return `<div class="rem-card">
      <div class="rem-bar" style="background:${col}"></div>
      <div class="rem-body">
        <div class="rem-title">${r.Titulo}</div>
        <div class="rem-meta" style="color:var(--accent)">${r.Iniciales||''}</div>
        <div class="rem-meta">${r.Tipo} · ${fmtDate(r.Fecha)}</div>
      </div>
      ${d!==null?`<div style="text-align:center"><div class="rem-days" style="color:${col}">${d<0?Math.abs(d)+'d':d===0?'Hoy':d+'d'}</div><div style="font-size:10px;color:var(--text3)">${d<0?'vencido':'rest.'}</div></div>`:''}
      <button class="rem-complete" onclick="completeGlobal('${r.ID_recordatorio}')">✓</button>
    </div>`;
  }
  m.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-family:'DM Serif Display',serif;font-size:22px">Agenda</div>
      <span style="font-size:12px;color:var(--text2)">${rems.length} pendientes</span>
    </div>
    ${overdue.length?`<div class="slabel" style="color:var(--danger)">⚠ Vencidos</div>${overdue.map(remG).join('')}`:''}
    ${today.length?`<div class="slabel" style="color:var(--warn)">Hoy</div>${today.map(remG).join('')}`:''}
    ${upcoming.length?`<div class="slabel">Próximos</div>${upcoming.map(remG).join('')}`:''}
    ${rems.length===0?`<div class="empty"><div class="ei">🔔</div><p>No hay recordatorios pendientes</p></div>`:''}`;
}
async function completeGlobal(id){
  const res=await sheets({action:'updateRecordatorio',id});
  if(res.ok){toast('Completado ✓','ok');renderAgenda(document.getElementById('main'));}
  else toast('Error','err');
}

async function deletePaciente(cic){
  if(!confirm('¿Eliminar este paciente y todos sus datos de la nube?'))return;
  const res=await sheets({action:'deletePaciente',cic});
  if(res.ok){
    // Eliminar también imágenes locales
    const imgs=loadImages();
    Object.keys(imgs).filter(k=>k.startsWith(cic+'_')).forEach(k=>delete imgs[k]);
    saveImages(imgs);
    toast('Paciente eliminado ✓','ok');
    nav('pacientes');
  } else toast('Error al eliminar','err');
}
nav('chat');
</script>
