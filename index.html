<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OftalmIA">
<meta name="theme-color" content="#0d0f14">
<title>OftalmIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--surface:#161921;--surface2:#1e2230;--border:rgba(255,255,255,0.07);--accent:#7eb8b4;--accent2:#c4a882;--text:#e8eaf0;--text2:#8a8fa8;--text3:#4a5060;--danger:#c47a7a;--success:#7ab89e;--warn:#c4a87a;--blue:#7a9ec4;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 10%,rgba(126,184,180,0.06) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 80% 80%,rgba(196,168,130,0.04) 0%,transparent 60%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:'DM Serif Display',serif;font-size:22px;letter-spacing:-0.3px}
.logo em{color:var(--accent);font-style:italic}
.logo-sub{font-size:10px;font-weight:400;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:1px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
main{flex:1;padding:14px 20px 90px;overflow-y:auto}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(22,25,33,0.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;cursor:pointer;color:var(--text3);font-size:10px;letter-spacing:0.5px;border:none;background:transparent;font-family:'DM Sans',sans-serif;transition:color 0.2s}
.nav-item .ni{font-size:19px;line-height:1}
.nav-item.active{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel-title{font-family:'DM Serif Display',serif;font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
input,textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;outline:none;transition:border-color 0.2s;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:none;min-height:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tags-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{padding:5px 10px;border-radius:20px;border:1px solid var(--border);font-size:12px;color:var(--text2);cursor:pointer;transition:all 0.15s;background:var(--surface2);user-select:none}
.tag.sel{background:var(--accent);border-color:var(--accent);color:#0d0f14}
.tag.custom-add{border-style:dashed;color:var(--text3)}
.pills{display:flex;gap:6px}
.pill{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;text-align:center;cursor:pointer;transition:all 0.15s;font-family:'DM Sans',sans-serif}
.pill.sel{background:var(--accent);border-color:var(--accent);color:#0d0f14}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;margin-bottom:6px}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--accent);color:#0d0f14}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-sm{padding:6px 12px;font-size:12px;width:auto;border-radius:8px;margin-bottom:0}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color 0.18s;position:relative;overflow:hidden}
.card:hover{border-color:var(--accent)}
.card .c-label{font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.card .c-name{font-family:'DM Serif Display',serif;font-size:17px;margin:2px 0}
.card .c-meta{font-size:12px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.b-teal{background:rgba(126,184,180,0.12);color:var(--accent)}
.b-gold{background:rgba(196,168,130,0.12);color:var(--accent2)}
.b-red{background:rgba(196,122,122,0.12);color:var(--danger)}
.b-green{background:rgba(122,184,158,0.12);color:var(--success)}
.slabel{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin:16px 0 8px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 12px;color:var(--text2);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0}
.irow{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.irow:last-child{border-bottom:none}
.ikey{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.8px;flex-shrink:0;padding-right:10px}
.ival{color:var(--text);text-align:right;max-width:65%}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.gitem{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--surface2);border:1px solid var(--border);cursor:pointer}
.gitem img{width:100%;height:100%;object-fit:cover}
.gitem-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:20px 8px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.gadd{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--text2);font-size:12px;transition:all 0.2s;background:transparent;font-family:'DM Sans',sans-serif}
.gadd:active{border-color:var(--accent);color:var(--accent)}
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cslot{border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--border);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);font-size:12px;cursor:pointer;gap:8px;position:relative}
.cslot img{width:100%;height:100%;object-fit:cover}
.clabel{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);font-size:10px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.rem-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.rem-bar{width:4px;border-radius:4px;align-self:stretch;flex-shrink:0}
.rem-body{flex:1;min-width:0}
.rem-title{font-size:14px;font-weight:500}
.rem-meta{font-size:12px;color:var(--text2);margin-top:2px}
.rem-days{font-size:20px;font-family:'DM Serif Display',serif;line-height:1;text-align:center}
.rem-complete{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;flex-shrink:0;font-size:14px}
.rem-complete:active{background:var(--success);border-color:var(--success);color:#0d0f14}
#chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 155px)}
.chat-msgs{flex:1;overflow-y:auto;padding:4px 0;scrollbar-width:none}
.chat-msgs::-webkit-scrollbar{display:none}
.msg{margin-bottom:12px;animation:fadeUp .25s ease}
.msg-ai .bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:12px 14px;font-size:14px;line-height:1.6;max-width:90%}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .bubble{background:var(--accent);color:#0d0f14;border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:14px;max-width:85%}
.msg-lbl{font-size:10px;color:var(--text3);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.chat-in-wrap{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.chat-in-wrap input{flex:1;border-radius:20px;padding:11px 16px}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--accent);border:none;color:#0d0f14;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.typing{display:flex;gap:4px;align-items:center;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6)}40%{transform:scale(1)}}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:20px 20px max(24px,env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 18px}
.sheet-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:18px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.lightbox img{max-width:94vw;max-height:80dvh;border-radius:12px;object-fit:contain}
.lb-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.12);border:none;color:white;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-del{background:rgba(196,122,122,.2);border:1px solid rgba(196,122,122,.4);color:var(--danger);padding:8px 20px;border-radius:10px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px}
.dtabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;margin-top:4px}
.dtab{flex:1;padding:10px 4px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.dtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.empty{text-align:center;padding:36px 20px;color:var(--text3)}
.empty .ei{font-size:32px;margin-bottom:8px;opacity:.5}
.empty p{font-size:13px}
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:9px 18px;font-size:13px;color:var(--text);opacity:0;transition:all .3s;z-index:300;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--success);color:var(--success)}
#toast.err{border-color:var(--danger);color:var(--danger)}
.hidden{display:none!important}
a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div id="app" style="display:none">
  <header>
    <div>
      <div class="logo">Oftalm<em>IA</em></div>
      <div class="logo-sub">Asistente Clínico</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="status-dot"></div>
      <button onclick="logout()" style="background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text3);font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;">Salir</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="nav('dashboard')" id="nb-dashboard"><span class="ni">📊</span>Inicio</button>
    <button class="nav-item" onclick="nav('pacientes')" id="nb-pacientes"><span class="ni">👁</span>Pacientes</button>
    <button class="nav-item" onclick="nav('nuevo')" id="nb-nuevo"><span class="ni">＋</span>Añadir</button>
    <button class="nav-item" onclick="nav('buscar')" id="nb-buscar"><span class="ni">🔍</span>Buscar</button>
    <button class="nav-item" onclick="nav('agenda')" id="nb-agenda"><span class="ni">🔔</span>Agenda</button>
    <button class="nav-item" onclick="nav('stats')" id="nb-stats"><span class="ni">📈</span>Stats</button>
  </nav>
</div>
<div id="toast"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbx8vMyBP6bBUa8oinsb9b_O9yJV2Tfz-lB0CXccGc7XRSBM--mmgm3kWV_0QXTYjcHQnA/exec";
const API_KEY="oftalmologia2026";
const CLAUDE_API="https://api.anthropic.com/v1/messages";
const IMG_KEY="oftalmia_images_v1";
const REM_KEY="oftalmia_reminders_v1";
const DIAGS=["Tumor palpebral","Chalazion","Blefaritis","Dermatocalasia","Ptosis","Obstrucción CNL","Entropión","Ectropión","Triquiasis","Parálisis facial","Ptosis ceja","Tumor orbitario","Inflamación orbitaria","Catarata","Uveítis","Úlcera corneal","Absceso corneal","Endoftalmitis","Pterigion"];
const PROCS=["Facoemulsificación","Escisión tumor y reconstrucción","Reinserción aponeurosis vía anterior","Reinserción aponeurosis vía posterior","Mullerectomía","Blefaroplastia superior","Tira tarsal","Cirugía pterigion"];
const REM_TYPES=["Llamada","Revisión presencial","Videoconsulta","WhatsApp","Cura","Retirada de puntos","Otro"];
let chatHistory=[],selDiags=[],selProcs=[],pillState={};

function loadImages(){try{return JSON.parse(localStorage.getItem(IMG_KEY)||'{}')}catch{return{}}}
function saveImages(d){localStorage.setItem(IMG_KEY,JSON.stringify(d))}
function genId(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function fmtDate(iso){
  if(!iso||iso==='—')return'—';
  // DD/MM/YYYY de Google Sheets
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(iso)){
    const [d,mo,y]=iso.split('/').map(Number);
    return new Date(y,mo-1,d).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
  }
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){
    const [y,mo,d]=iso.split('-').map(Number);
    return new Date(y,mo-1,d).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
  }
  // ISO completo con T y Z — tomar solo la parte de fecha local
  if(iso.includes('T')){
    const part=iso.split('T')[0];
    const [y,mo,d]=part.split('-').map(Number);
    return new Date(y,mo-1,d).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
  }
  return iso;
}
function daysUntil(iso){if(!iso)return null;return Math.ceil((new Date(iso)-new Date())/86400000)}

// ── CACHÉ ────────────────────────────────────────────────────
const CACHE_KEY='oftalmia_cache_v1';
const CACHE_TTL=5*60*1000; // 5 minutos

function loadCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')}catch{return{}}}
function saveCache(c){try{localStorage.setItem(CACHE_KEY,JSON.stringify(c))}catch{}}
function getCached(key){
  const c=loadCache();const entry=c[key];
  if(!entry)return null;
  if(Date.now()-entry.ts>CACHE_TTL)return null;
  return entry.data;
}
function setCache(key,data){
  const c=loadCache();
  c[key]={data,ts:Date.now()};
  saveCache(c);
}
function invalidateCache(...keys){
  const c=loadCache();
  if(keys.length===0){localStorage.removeItem(CACHE_KEY);}
  else{keys.forEach(k=>delete c[k]);saveCache(c);}
}

// ── SHEETS API con caché ─────────────────────────────────────
// Acciones de lectura que se cachean
const CACHEABLE=['getPacientes','getEpisodios','getSeguimientos'];

async function sheets(params){
  const url=new URL(API_URL);
  url.searchParams.set('key',API_KEY);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,String(v)));

  // Clave de caché basada en acción + parámetros relevantes
  const cacheKey=params.action+'_'+(params.cic||'')+'_'+(params.id_episodio||'')+'_'+(params.diagnostico||'')+'_'+(params.procedimiento||'');
  const isCacheable=CACHEABLE.includes(params.action);

  // Si hay caché válida, devolver inmediatamente y refrescar en background
  if(isCacheable){
    const cached=getCached(cacheKey);
    if(cached){
      // Refresh silencioso en background
      fetch(url.toString()).then(r=>r.json()).then(fresh=>{
        if(fresh.ok)setCache(cacheKey,fresh);
      }).catch(()=>{});
      return cached;
    }
  }

  // Sin caché: fetch normal
  try{
    const r=await fetch(url.toString());
    const data=await r.json();
    if(isCacheable&&data.ok)setCache(cacheKey,data);
    return data;
  }catch(e){return{error:e.toString()};}
}

// Invalida caché relevante tras escrituras
function invalidateAfterWrite(action,cic){
  if(action.includes('Paciente'))invalidateCache('getPacientes_','getPacientes_'+(cic||''));
  if(action.includes('Episodio'))invalidateCache('getEpisodios_','getEpisodios_'+(cic||''));
  if(action.includes('Seguimiento'))invalidateCache('getSeguimientos_');
  if(action.includes('Nota')||action.includes('Recordatorio')){}// no cacheadas
}

async function sheetsWrite(params){
  const res=await sheets(params);
  if(res.ok)invalidateAfterWrite(params.action,params.cic);
  return res;
}

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show '+type;
  setTimeout(()=>t.className='',2800);
}

function nav(name){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const nb=document.getElementById('nb-'+name);if(nb)nb.classList.add('active');
  const m=document.getElementById('main');
  if(name==='dashboard')renderDashboard(m);
  else if(name==='pacientes')renderPacientes(m);
  else if(name==='nuevo')renderNuevo(m);
  else if(name==='buscar')renderBuscar(m);
  else if(name==='agenda')renderAgenda(m);
  else if(name==='stats')renderStats(m);
}

// ── DASHBOARD ────────────────────────────────────────────────
async function renderDashboard(m){
  m.innerHTML=`<div style="text-align:center;padding:30px;color:var(--text3)">Cargando...</div>`;
  const [pacRes,epiRes,remRes]=await Promise.all([
    sheets({action:'getPacientes'}),
    sheets({action:'getEpisodios'}),
    sheets({action:'getRecordatorios',soloActivos:'true'})
  ]);
  const pacs=pacRes.datos||[];
  const epis=epiRes.datos||[];
  const rems=remRes.datos||[];

  // Estadísticas
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const inicioAnio=new Date(hoy.getFullYear(),0,1);

  const episMes=epis.filter(e=>{
    if(!e['Fecha Cirugia'])return false;
    const d=new Date(e['Fecha Cirugia'].split('/').reverse().join('-'));
    return d>=inicioMes;
  });
  const episAnio=epis.filter(e=>{
    if(!e['Fecha Cirugia'])return false;
    const d=new Date(e['Fecha Cirugia'].split('/').reverse().join('-'));
    return d>=inicioAnio;
  });
  const complics=epis.filter(e=>e.Complicaciones==='Sí');
  const remsHoy=rems.filter(r=>daysUntil(r.Fecha)===0);
  const remsVencidos=rems.filter(r=>{const d=daysUntil(r.Fecha);return d!==null&&d<0;});
  const remsSemana=rems.filter(r=>{const d=daysUntil(r.Fecha);return d!==null&&d>0&&d<=7;});

  // Procedimientos más frecuentes
  const procCount={};
  epis.forEach(e=>{
    if(!e.Procedimientos)return;
    e.Procedimientos.split(',').forEach(p=>{
      const k=p.trim();if(k)procCount[k]=(procCount[k]||0)+1;
    });
  });
  const topProcs=Object.entries(procCount).sort((a,b)=>b[1]-a[1]).slice(0,4);

  // Diagnósticos más frecuentes
  const diagCount={};

// ── PATIENT DETAIL ───────────────────────────────────────────
async function showPaciente(cic){
  const m=document.getElementById('main');
  m.innerHTML=`<div class="panel"><p style="color:var(--text3)">Cargando...</p></div>`;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const [pacRes,epiRes]=await Promise.all([sheets({action:'getPacientes',cic}),sheets({action:'getEpisodios',cic})]);
  const pac=(pacRes.datos||[])[0];const epis=epiRes.datos||[];
  if(!pac){toast('Paciente no encontrado','err');nav('pacientes');return;}
  const imgs=loadImages();
  const totalImgs=Object.keys(imgs).filter(k=>k.startsWith(cic+'_')).reduce((a,k)=>a+imgs[k].length,0);
  m.innerHTML=`
    <div class="dhead">
      <button class="back-btn" onclick="nav('pacientes')">← Volver</button>
      <div style="flex:1">
        <div style="font-family:'DM Serif Display',serif;font-size:20px">${pac.Iniciales}</div>
        <div style="font-size:11px;color:var(--text3)">CIC ${cic} · ${pac.Edad} años${pac.Centro?` · <span style="color:var(--accent)">${pac.Centro}</span>`:''}</div>
      </div>
      <button onclick="deletePaciente('${cic}')" style="background:rgba(196,122,122,0.12);border:1px solid rgba(196,122,122,0.25);color:var(--danger);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0">Eliminar</button>
    </div>
    <div class="dtabs">
      <div class="dtab active" onclick="switchTab('${cic}','episodios')">Episodios</div>
      <div class="dtab" onclick="switchTab('${cic}','imagenes')">📷${totalImgs>0?' '+totalImgs:''}</div>
      <div class="dtab" onclick="switchTab('${cic}','cataratas')">🔬Cat</div>
      <div class="dtab" onclick="switchTab('${cic}','notas')">Notas</div>
      <div class="dtab" onclick="switchTab('${cic}','recordatorios')">🔔</div>
    </div>
    <div id="ptab"></div>`;
  window._pac=pac;window._epis=epis;

async function switchTab(cic,tab){
  document.querySelectorAll('.dtab').forEach((t,i)=>t.classList.toggle('active',['episodios','imagenes','notas','recordatorios'][i]===tab));
  if(!window._pac||window._pac.CIC!==cic){
    const [pacRes,epiRes]=await Promise.all([sheets({action:'getPacientes',cic}),sheets({action:'getEpisodios',cic})]);
    window._pac=(pacRes.datos||[])[0];window._epis=epiRes.datos||[];
  }
  renderTab(cic,tab);
}

function renderTab(cic,tab){
  const el=document.getElementById('ptab');if(!el)return;
  const pac=window._pac;const epis=window._epis||[];
  const imgs=loadImages();

  if(tab==='episodios'){
    // Separar quirúrgicos y clínicos
    const quirurgicos=epis.filter(ep=>ep['Fecha Cirugia']&&ep['Fecha Cirugia'].toString().trim()!=='');
    const clinicos=epis.filter(ep=>!ep['Fecha Cirugia']||ep['Fecha Cirugia'].toString().trim()==='');

    function epCard(ep,tipo){
      const isQx=tipo==='qx';
      return `<div class="card" onclick="showEpisodio('${ep.ID_episodio}','${cic}')"
        style="border-left:3px solid ${isQx?'var(--accent2)':'var(--border)'}">

          <div class="c-label" style="font-size:10px">${ep.ID_episodio}</div>

        </div>
        <div style="font-size:15px;font-weight:400;color:var(--text);margin-bottom:6px">${ep.Diagnosticos||ep.Procedimientos||'—'}</div>

          ${isQx?`<span>📅 ${fmtDate(ep['Fecha Cirugia'])}</span>`:''}
          ${ep.Ojo?`<span>👁 ${ep.Ojo}</span>`:''}
          ${ep.Procedimientos?`<span style="color:var(--accent2)">${ep.Procedimientos.split(',')[0].trim()}</span>`:''}
          ${ep.Complicaciones==='Sí'?`<span class="badge b-red">⚠ Complicación</span>`:''}
          ${ep.Reintervencion==='Sí'?`<span class="badge b-gold">↩ Reintervención</span>`:''}

      </div>`;
    }

    el.innerHTML=`
      ${epis.length===0?`<div class="empty"><div class="ei">📋</div><p>Sin episodios</p></div>`:`
        ${quirurgicos.length?`<div class="slabel">Cirugías (${quirurgicos.length})</div>${quirurgicos.map(ep=>epCard(ep,'qx')).join('')}`:''}
        ${clinicos.length?`<div class="slabel">Episodios clínicos (${clinicos.length})</div>${clinicos.map(ep=>epCard(ep,'cl')).join('')}`:''}

        <button class="btn btn-ghost" style="flex:1;border-color:rgba(196,168,130,0.4);color:var(--accent2)" onclick="openRegistroRapidoPaciente('${cic}','${pac.Iniciales}')">🔪 Cirugía</button>
      </div>`;
  } else if(tab==='imagenes'){
    const patImgs=[];
    epis.forEach(ep=>{(imgs[cic+'_'+ep.ID_episodio]||[]).forEach(img=>patImgs.push({...img,epId:ep.ID_episodio}));});
    (imgs[cic+'_standalone']||[]).forEach(img=>patImgs.push({...img,epId:'standalone'}));
    const pre=patImgs.filter(i=>i.type==='pre');const post=patImgs.filter(i=>i.type==='post');
    el.innerHTML=`
      <div class="slabel">Galería (${patImgs.length})</div>
      <div class="gallery-grid">
        ${patImgs.map(img=>`<div class="gitem" onclick="openLightboxEp('${cic}','${img.epId}','${img.id}')">
          <img src="${img.src}"><div class="gitem-label" style="color:${img.type==='pre'?'var(--accent2)':'var(--accent)'}">${img.label}</div></div>`).join('')}
        <button class="gadd" onclick="openAddImage('${cic}','standalone','pre')">📷<span>Pre-op</span></button>
        <button class="gadd" onclick="openAddImage('${cic}','standalone','post')">📷<span>Post-op</span></button>
      </div>
      ${pre.length>0&&post.length>0?`<div class="slabel" style="margin-top:16px">Comparativa Pre / Post</div>
        <div class="compare-row">
          <div class="cslot"><img src="${pre[0].src}"><span class="clabel" style="color:var(--accent2)">Pre</span></div>
          <div class="cslot"><img src="${post[0].src}"><span class="clabel" style="color:var(--accent)">Post</span></div>
        </div>`:''}`;

          +'<div class="irow"><span class="ikey">K1/K2</span><span class="ival">'+(c.K1||'—')+' / '+(c.K2||'—')+' D</span></div>'

function remCardSheets(r,cic){
  const d=daysUntil(r.Fecha);
  const col=d===null?'var(--text2)':d<0?'var(--danger)':d===0?'var(--warn)':'var(--success)';
  return `<div class="rem-card">
    <div class="rem-bar" style="background:${col}"></div>
    <div class="rem-body"><div class="rem-title">${r.Titulo}</div><div class="rem-meta">${r.Tipo} · ${fmtDate(r.Fecha)}</div></div>
    ${d!==null?`<div style="text-align:center"><div class="rem-days" style="color:${col}">${d<0?Math.abs(d)+'d':d===0?'Hoy':d+'d'}</div><div style="font-size:10px;color:var(--text3)">${d<0?'vencido':'rest.'}</div></div>`:''}
    <button class="rem-complete" onclick="completeReminder('${r.ID_recordatorio}','${cic}')">✓</button>
  </div>`;
}

// Fotos pendientes para nuevo paciente
let _fotosNuevo=[];
function capturarFotoNuevo(tipo){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.style.cssText='position:fixed;top:-100px;left:-100px;opacity:0;';
  document.body.appendChild(inp);
  inp.onchange=(e)=>{
    const file=e.target.files[0];
    document.body.removeChild(inp);
    if(!file)return;
    toast('Procesando...','');
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const MAX=1200;let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const src=canvas.toDataURL('image/jpeg',0.82);
      _fotosNuevo.push({src,tipo,id:genId(),label:(tipo==='pre'?'Pre-op':'Post-op')+' '+new Date().toLocaleDateString('es-ES'),date:new Date().toISOString()});
      const prev=document.getElementById('n-foto-preview');
      if(prev){
        const div=document.createElement('div');
        div.style.cssText='position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--border)';
        div.innerHTML=`<img src="${src}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);font-size:9px;text-align:center;padding:2px;color:${tipo==='pre'?'var(--accent2)':'var(--accent)'}">${tipo==='pre'?'Pre':'Post'}</div>`;
        prev.appendChild(div);
      }
      toast('Foto añadida ✓','ok');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast('Error','err');};
    img.src=url;
  };
  inp.click();
}

async function submitPacienteCompleto(){
  const cic=document.getElementById('n-cic').value.trim();
  const ini=document.getElementById('n-ini').value.trim();
  const edad=document.getElementById('n-edad').value.trim();
  if(!cic||!ini||!edad){toast('CIC, iniciales y edad son obligatorios','err');return;}
  const centro=pillState['centro']||'';

  // 1. Registrar paciente
  const resPac=await sheetsWrite({action:'addPaciente',cic,iniciales:ini,edad,centro});
  if(!resPac.ok){toast('Error al registrar paciente','err');return;}

  // 2. Si hay diagnósticos o procedimientos, crear episodio
  if(selDiags.length||selProcs.length){
    await sheetsWrite({
      action:'addEpisodio',cic,iniciales:ini,ojo:'',
      fechaInclusion:'',fechaCirugia:'',
      diagnosticos:selDiags.join(', '),
      procedimientos:selProcs.join(', '),
      complicaciones:'No',descripcionComplicacion:'',
      reintervencion:'No',driveUrl:''
    });
  }

  // 3. Si hay nota, guardarla
  const nota=document.getElementById('n-nota').value.trim();
  if(nota){
    await sheetsWrite({action:'addNota',cic,texto:nota,tag:'consulta',fecha:new Date().toLocaleDateString('es-ES')});
  }

  // 4. Si hay fotos, guardarlas en localStorage
  if(_fotosNuevo.length){
    const imgs=loadImages();
    const key=cic+'_standalone';
    if(!imgs[key])imgs[key]=[];
    _fotosNuevo.forEach(f=>imgs[key].push(f));
    saveImages(imgs);
  }

  toast('Paciente registrado ✓','ok');
  _fotosNuevo=[];
  selDiags=[];selProcs=[];pillState={};
  renderNuevo(document.getElementById('main'));
}

function toggleTag(el,type){
  el.classList.toggle('sel');const v=el.textContent;
  if(type==='diag')selDiags=el.classList.contains('sel')?[...selDiags,v]:selDiags.filter(d=>d!==v);
  else selProcs=el.classList.contains('sel')?[...selProcs,v]:selProcs.filter(p=>p!==v);
}
function addCustomTag(type){
  const v=prompt(type==='diag'?'Diagnóstico personalizado:':'Procedimiento personalizado:');
  if(!v?.trim())return;
  const wrap=document.getElementById(type==='diag'?'diag-tags':'proc-tags');
  const tag=document.createElement('div');tag.className='tag sel';tag.textContent=v.trim();
  tag.onclick=function(){toggleTag(this,type)};
  wrap.insertBefore(tag,wrap.querySelector('.custom-add'));
  if(type==='diag')selDiags.push(v.trim());else selProcs.push(v.trim());
}
function selPill(el,group){
  document.querySelectorAll(`.pill[data-v]`).forEach(p=>{if(p.closest('.pills')===el.closest('.pills'))p.classList.remove('sel');});
  el.classList.add('sel');pillState[group]=el.dataset.v;
  if(group==='comp')document.getElementById('comp-desc-wrap').classList.toggle('hidden',el.dataset.v!=='Sí');
}

function openAddImage(cic,episodioId,type){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.style.cssText='position:fixed;top:-100px;left:-100px;opacity:0;';
  document.body.appendChild(inp);
  inp.onchange=(e)=>{
    const file=e.target.files[0];
    document.body.removeChild(inp);
    if(!file)return;
    toast('Procesando imagen...','');
    // Redimensionar antes de guardar para evitar problemas de memoria en Safari iOS
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const MAX=1200;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      const src=canvas.toDataURL('image/jpeg',0.82);
      const imgs=loadImages();const key=cic+'_'+episodioId;if(!imgs[key])imgs[key]=[];
      const label=(type==='pre'?'Pre-op':'Post-op')+' '+new Date().toLocaleDateString('es-ES');
      imgs[key].push({id:genId(),src,type,label,date:new Date().toISOString()});
      saveImages(imgs);toast('Imagen guardada ✓','ok');
      if(episodioId==='standalone')showPaciente(cic);else showEpisodio(episodioId,cic);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast('Error al cargar imagen','err');};
    img.src=url;
  };
  inp.click();
}
function openLightbox(cic,imgId){openLightboxEp(cic,'standalone',imgId);}
function openLightboxEp(cic,epId,imgId){
  const imgs=loadImages();const key=cic+'_'+epId;

async function renderStats(m){
  m.innerHTML=`<div style="text-align:center;padding:30px;color:var(--text3)">Cargando estadísticas...</div>`;
  const [epiRes,pacRes]=await Promise.all([
    sheets({action:'getEpisodios'}),
    sheets({action:'getPacientes'})
  ]);
  const epis=epiRes.datos||[];
  const pacs=pacRes.datos||[];

  const hoy=new Date();
  const inicioMes=new Date(hoy.getFullYear(),hoy.getMonth(),1);
  const inicioAnio=new Date(hoy.getFullYear(),0,1);

  function parseDate(str){
    if(!str)return null;
    if(str.includes('T'))return new Date(str.split('T')[0]);
    if(str.includes('/')){{const[d,mo,y]=str.split('/');return new Date(y,mo-1,d);}}
    if(str.includes('-')){{const[y,mo,d]=str.split('-');return new Date(y,mo-1,d);}}
    return null;
  }

  // Cirugías por procedimiento
  const procCount={};
  epis.forEach(e=>{
    if(!e.Procedimientos)return;
    e.Procedimientos.split(',').forEach(p=>{
      const k=p.trim();if(k)procCount[k]=(procCount[k]||0)+1;
    });
  });

  // Cirugías por diagnóstico
  const diagCount={};
  epis.forEach(e=>{
    if(!e.Diagnosticos)return;
    e.Diagnosticos.split(',').forEach(d=>{
      const k=d.trim();if(k)diagCount[k]=(diagCount[k]||0)+1;
    });
  });

  // Por centro
  const centroCount={};
  pacs.forEach(p=>{
    const k=p.Centro||'Sin centro';
    centroCount[k]=(centroCount[k]||0)+1;
  });

  // Cirugías por mes (últimos 6 meses)
  const meses={};
  for(let i=5;i>=0;i--){
    const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
    const k=d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'});
    meses[k]=0;
  }
  epis.forEach(e=>{
    const d=parseDate(e['Fecha Cirugia']);
    if(!d)return;
    const k=d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'});
    if(k in meses)meses[k]++;
  });

  // Complicaciones por procedimiento
  const compProc={};
  epis.filter(e=>e.Complicaciones==='Sí').forEach(e=>{
    if(!e.Procedimientos)return;
    e.Procedimientos.split(',').forEach(p=>{
      const k=p.trim();if(k)compProc[k]=(compProc[k]||0)+1;
    });
  });

  // Ojo operado
  const ojoCount={OD:0,OI:0,AO:0};
  epis.forEach(e=>{if(e.Ojo&&ojoCount[e.Ojo]!==undefined)ojoCount[e.Ojo]++;});

  const topProcs=Object.entries(procCount).sort((a,b)=>b[1]-a[1]);
  const topDiags=Object.entries(diagCount).sort((a,b)=>b[1]-a[1]);
  const maxP=topProcs[0]?.[1]||1;
  const maxD=topDiags[0]?.[1]||1;
  const maxM=Math.max(...Object.values(meses),1);

  m.innerHTML=`
    <div style="font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:16px">Estadísticas</div>

    <div class="panel">
      <div class="panel-title">📅 Cirugías últimos 6 meses</div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:80px;margin-bottom:8px">
        ${Object.entries(meses).map(([k,v])=>`
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
            <div style="font-size:11px;color:var(--accent);font-weight:500">${v||''}</div>
            <div style="width:100%;background:var(--accent);border-radius:4px 4px 0 0;height:${Math.max(v/maxM*60,v?4:0)}px;transition:height .3s"></div>
            <div style="font-size:9px;color:var(--text3);text-align:center">${k}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">🔪 Por procedimiento</div>
      ${topProcs.map(([p,n])=>`
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>${p}</span>
            <div style="display:flex;gap:8px;align-items:center">
              ${compProc[p]?`<span style="font-size:11px;color:var(--danger)">⚠ ${compProc[p]}</span>`:''}
              <span style="color:var(--accent);font-weight:600">${n}</span>
            </div>
          </div>
          <div style="height:5px;background:var(--surface2);border-radius:4px">
            <div style="height:5px;background:var(--accent);border-radius:4px;width:${Math.round(n/maxP*100)}%"></div>
          </div>
        </div>`).join('')}
      ${!topProcs.length?'<div style="color:var(--text3);font-size:13px">Sin datos</div>':''}
    </div>

    <div class="panel">
      <div class="panel-title">👁 Por diagnóstico</div>
      ${topDiags.map(([d,n])=>`
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
            <span>${d}</span><span style="color:var(--accent2);font-weight:600">${n}</span>
          </div>
          <div style="height:5px;background:var(--surface2);border-radius:4px">
            <div style="height:5px;background:var(--accent2);border-radius:4px;width:${Math.round(n/maxD*100)}%"></div>
          </div>
        </div>`).join('')}
      ${!topDiags.length?'<div style="color:var(--text3);font-size:13px">Sin datos</div>':''}
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <div class="panel" style="text-align:center;padding:14px">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Ojo operado</div>
        ${['OD','OI','AO'].map(o=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--text2)">${o}</span><span style="color:var(--accent);font-weight:600">${ojoCount[o]}</span></div>`).join('')}
      </div>
      <div class="panel" style="text-align:center;padding:14px">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Por centro</div>
        ${Object.entries(centroCount).map(([c,n])=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span style="color:var(--text2)">${c}</span><span style="color:var(--accent2);font-weight:600">${n}</span></div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">⚠ Complicaciones</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
        <span style="color:var(--text2)">Total complicaciones</span>
        <span style="color:var(--danger);font-weight:600">${epis.filter(e=>e.Complicaciones==='Sí').length}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px">
        <span style="color:var(--text2)">Reintervenciones</span>
        <span style="color:var(--warn);font-weight:600">${epis.filter(e=>e.Reintervencion==='Sí').length}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="color:var(--text2)">Tasa complicaciones</span>
        <span style="color:var(--text);font-weight:600">${epis.length?Math.round(epis.filter(e=>e.Complicaciones==='Sí').length/epis.length*100):0}%</span>
      </div>
    </div>`;
}

async function buscarPacientes(){
  const query=document.getElementById('b-pac').value.trim().toLowerCase();
  const centro=document.getElementById('b-centro').value;
  const res=document.getElementById('buscar-res');
  res.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3)">Buscando...</div>`;

  let datos=[];
  try{
    const url=API_URL+'?key='+API_KEY+'&action=getPacientes';
    const r=await fetch(url, {redirect:'follow'});
    const json=await r.json();
    datos=json.datos||[];
  }catch(e){
    res.innerHTML=`<div class="empty"><div class="ei">⚠</div><p>Error: ${e.message}</p></div>`;
    return;
  }

  if(query) datos=datos.filter(p=>
    String(p.CIC||'').toLowerCase().includes(query)||
    String(p.Iniciales||'').toLowerCase().includes(query)
  );
  if(centro) datos=datos.filter(p=>p.Centro===centro);

  if(!datos.length){
    res.innerHTML=`<div class="empty"><div class="ei">🔍</div><p>Sin resultados</p></div>`;
    return;
  }

  res.innerHTML=`<div class="slabel">${datos.length} paciente${datos.length!==1?'s':''}</div>
    ${datos.map(p=>`
      <div class="card" onclick="showPaciente('${p.CIC}')">

        <div class="c-meta"><span>🎂 ${p.Edad} años</span><span>📅 ${fmtDate(p['Fecha Registro'])}</span></div>
      </div>`).join('')}`;
}

async function submitRegistroRapido(sheetEl,esNuevo,cicPrefill,iniPrefill){
  // Determinar CIC e iniciales
  let cic,ini;
  const tabNuevo=document.getElementById('rq-nuevo-fields')?.style.display==='block';

  if(cicPrefill){
    cic=cicPrefill;ini=iniPrefill;
  } else if(tabNuevo){
    cic=document.getElementById('rq-cic-new')?.value.trim();
    ini=document.getElementById('rq-ini-new')?.value.trim();
    const edad=document.getElementById('rq-edad-new')?.value.trim();
    const centro=pillState['rq-centro']||'';
    if(!cic||!ini||!edad){toast('CIC, iniciales y edad obligatorios','err');return;}
    // Crear paciente nuevo
    const rPac=await sheetsWrite({action:'addPaciente',cic,iniciales:ini,edad,centro});
    if(!rPac.ok){toast('Error al crear paciente','err');return;}
  } else {
    cic=document.getElementById('rq-cic')?.value.trim();
    ini=document.getElementById('rq-ini')?.value.trim();
    if(!cic||!ini){toast('CIC e iniciales obligatorios','err');return;}
  }

  const procSelect=document.getElementById('rq-proc')?.value;
  const proc=procSelect==='__otro'?document.getElementById('rq-proc-otro')?.value.trim():procSelect;
  if(!proc){toast('Selecciona un procedimiento','err');return;}

  const diagSelect=document.getElementById('rq-diag')?.value;
  const diag=diagSelect==='__otro'?document.getElementById('rq-diag-otro')?.value.trim():diagSelect;

  const ojo=pillState['rq-ojo']||'';
  const fecha=document.getElementById('rq-fecha')?.value||'';
  const inc=document.getElementById('rq-inc')?.value.trim()||'';
  const diasRev=pillState['rq-rev'];

  // Crear episodio
  const epRes=await sheetsWrite({
    action:'addEpisodio',cic,iniciales:ini,ojo,
    fechaInclusion:'',fechaCirugia:fecha,
    diagnosticos:diag||'',procedimientos:proc,
    complicaciones:inc?'Sí':'No',
    descripcionComplicacion:inc,
    reintervencion:'No',driveUrl:''
  });
  if(!epRes.ok){toast('Error al registrar cirugía','err');return;}

  // Crear recordatorio si aplica
  if(diasRev&&diasRev!=='0'){
    let fechaRevStr,label;
    if(diasRev==='custom'){
      fechaRevStr=document.getElementById('rq-rev-fecha')?.value;
      if(!fechaRevStr){toast('Selecciona fecha de revisión','err');return;}
      label=fmtDate(fechaRevStr);
    } else {
      const fr=new Date(fecha);fr.setDate(fr.getDate()+parseInt(diasRev));
      fechaRevStr=fr.toISOString().split('T')[0];
      label=diasRev==='7'?'1 semana':diasRev==='14'?'2 semanas':diasRev==='30'?'1 mes':'3 meses';
    }
    await sheetsWrite({action:'addRecordatorio',cic,iniciales:ini,titulo:`Revisión post-${proc} (${label})`,fecha:fechaRevStr,tipo:'Revisión presencial'});
    toast(`Cirugía registrada + revisión el ${fmtDate(fechaRevStr)} ✓`,'ok');
  } else {
    toast('Cirugía registrada ✓','ok');
  }

  sheetEl.remove();
  pillState['rq-rev']=null;

  // Navegar a ficha del paciente para ver el resultado
  invalidateCache('getEpisodios_'+cic+'__','getEpisodios____');
  showPaciente(cic);
}

  const handle=document.createElement('div');handle.className='sheet-handle';

  const f2=document.createElement('div');f2.className='field';
  const lbl=document.createElement('label');lbl.textContent='Tipo';
  const pills=document.createElement('div');pills.className='pills';
  ['Pre-op','Post-op'].forEach(t=>{
    const p=document.createElement('div');
    p.className='pill';p.textContent=t;p.dataset.v=t;
    p.onclick=function(){pills.querySelectorAll('.pill').forEach(x=>x.classList.remove('sel'));this.classList.add('sel');pillState['ir-tipo']=this.dataset.v;};
    pills.appendChild(p);
  });
  f2.appendChild(lbl);f2.appendChild(pills);

  const btnFoto=document.createElement('button');
  btnFoto.className='btn btn-primary';btnFoto.textContent='Seleccionar foto';
  btnFoto.style.marginTop='8px';
  btnFoto.onclick=()=>{
    const cic=document.getElementById('ir-cic').value.trim();
    if(!cic){toast('Introduce el CIC','err');return;}
    const tipo=pillState['ir-tipo'];
    if(!tipo){toast('Selecciona Pre-op o Post-op','err');return;}
    s.remove();
    // Guardar imagen directamente sin verificar paciente
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';
    inp.style.cssText='position:fixed;top:-100px;left:-100px;opacity:0;';
    document.body.appendChild(inp);
    inp.onchange=(e)=>{
      const file=e.target.files[0];
      document.body.removeChild(inp);
      if(!file)return;
      toast('Procesando imagen...','');
      const img=new Image();
      const url=URL.createObjectURL(file);
      img.onload=()=>{
        URL.revokeObjectURL(url);
        const MAX=1200;
        let w=img.width,h=img.height;
        if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const src=canvas.toDataURL('image/jpeg',0.82);
        const imgs=loadImages();
        const key=cic+'_standalone';
        if(!imgs[key])imgs[key]=[];
        const label=(tipo==='Pre-op'?'Pre-op':'Post-op')+' '+new Date().toLocaleDateString('es-ES');
        imgs[key].push({id:genId(),src,type:tipo==='Pre-op'?'pre':'post',label,date:new Date().toISOString()});
        saveImages(imgs);
        toast('Imagen guardada ✓','ok');
      };
      img.onerror=()=>{URL.revokeObjectURL(url);toast('Error al cargar imagen','err');};
      img.src=url;
    };
    inp.click();
  };

  const btnCan=document.createElement('button');
  btnCan.className='btn btn-ghost';btnCan.textContent='Cancelar';
  btnCan.onclick=()=>s.remove();

  sheet.appendChild(handle);sheet.appendChild(title);
  sheet.appendChild(f1);sheet.appendChild(f2);
  sheet.appendChild(btnFoto);sheet.appendChild(btnCan);
  s.appendChild(sheet);
  s.onclick=()=>s.remove();
  document.body.appendChild(s);
}

  let html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div style="font-family:DM Serif Display,serif;font-size:22px">Agenda</div>'
    +'<span style="font-size:12px;color:var(--text2)">'+rems.length+' pendientes</span>'
  +'</div>'
  +semanaHTML;
  if(overdue.length)html+='<div class="slabel" style="color:var(--danger)">⚠ Vencidos</div>'+overdue.map(remG).join('');
  if(upcoming.length)html+='<div class="slabel">Próximos</div>'+upcoming.map(remG).join('');
  if(!rems.length)html+='<div class="empty"><div class="ei">🔔</div><p>No hay recordatorios pendientes</p></div>';
  m.innerHTML=html;
}
async function completeGlobal(id){
  const res=await sheets({action:'updateRecordatorio',id});
  if(res.ok){toast('Completado ✓','ok');renderAgenda(document.getElementById('main'));}
  else toast('Error','err');
}

async function deletePaciente(cic){
  if(!confirm('¿Eliminar este paciente y todos sus datos de la nube?'))return;
  const res=await sheetsWrite({action:'deletePaciente',cic});
  if(res.ok){
    // Eliminar también imágenes locales
    const imgs=loadImages();
    Object.keys(imgs).filter(k=>k.startsWith(cic+'_')).forEach(k=>delete imgs[k]);
    saveImages(imgs);
    toast('Paciente eliminado ✓','ok');
    nav('pacientes');
  } else toast('Error al eliminar','err');
}
const APP_PASS="oftalmia2026"; // Cambia esto por tu contraseña
const AUTH_KEY="oftalmia_auth_v1";
const AUTH_TTL=8*60*60*1000; // Sesión de 8 horas

function isAuthenticated(){
  try{
    const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'{}');
    return a.ts && (Date.now()-a.ts < AUTH_TTL);
  }catch{return false;}
}
function setAuthenticated(){
  localStorage.setItem(AUTH_KEY,JSON.stringify({ts:Date.now()}));
}
function logout(){
  localStorage.removeItem(AUTH_KEY);
  showLogin();
}

function showLogin(){
  document.getElementById('app').style.display='none';
  let login=document.getElementById('login-screen');
  if(!login){
    login=document.createElement('div');
    login.id='login-screen';
    login.style.cssText='position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;padding:32px;';

    const inner=document.createElement('div');
    inner.style.cssText='width:100%;max-width:320px';

    const logo=document.createElement('div');
    logo.style.cssText='text-align:center;margin-bottom:32px';
    logo.innerHTML='<div style="font-family:DM Serif Display,serif;font-size:32px;color:var(--text)">Oftalm<em style="color:var(--accent);font-style:italic">IA</em></div><div style="font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:4px">Asistente Clínico</div>';

    const box=document.createElement('div');
    box.style.cssText='background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px';

    const hint=document.createElement('div');
    hint.style.cssText='font-size:13px;color:var(--text2);margin-bottom:16px;text-align:center';
    hint.textContent='Introduce tu contraseña';

    const inp=document.createElement('input');
    inp.type='password';inp.id='login-pass';inp.placeholder='Contraseña';
    inp.style.cssText='width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:16px;outline:none;margin-bottom:12px;-webkit-appearance:none;box-sizing:border-box;font-family:DM Sans,sans-serif';
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkLogin();});

    const err=document.createElement('div');
    err.id='login-err';
    err.style.cssText='color:var(--danger);font-size:12px;text-align:center;margin-bottom:10px;min-height:16px';

    const btn=document.createElement('button');
    btn.style.cssText='width:100%;padding:13px;background:var(--accent);color:#0d0f14;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:DM Sans,sans-serif';
    btn.textContent='Entrar';
    btn.onclick=checkLogin;

    box.appendChild(hint);box.appendChild(inp);box.appendChild(err);box.appendChild(btn);
    inner.appendChild(logo);inner.appendChild(box);
    login.appendChild(inner);
    document.body.appendChild(login);
  }
  login.style.display='flex';
  setTimeout(()=>document.getElementById('login-pass')?.focus(),100);
}

function checkLogin(){
  const pass=document.getElementById('login-pass').value;
  if(pass===APP_PASS){
    setAuthenticated();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('login-pass').value='';
    initApp();
  } else {
    document.getElementById('login-err').textContent='Contraseña incorrecta';
    document.getElementById('login-pass').value='';
    document.getElementById('login-pass').focus();
    setTimeout(()=>document.getElementById('login-err').textContent='',2000);
  }
}

function initApp(){
  nav('dashboard');
  setTimeout(()=>{
    sheets({action:'getPacientes'});
    sheets({action:'getEpisodios'});
  },500);
}

// Arranque — pequeño delay para que iOS PWA inicialice correctamente
setTimeout(()=>{
  try{
    if(isAuthenticated()){
      initApp();
    } else {
      showLogin();
    }
  }catch(e){
    showLogin();
  }
},150);
</script>
