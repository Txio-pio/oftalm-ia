<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OftalmIA">
<meta name="theme-color" content="#0a0f1e">
<title>OftalmIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --bg2: #0f1628;
    --bg3: #161e35;
    --border: rgba(100,140,255,0.12);
    --accent: #4a7fff;
    --accent2: #7eb8ff;
    --gold: #c9a96e;
    --text: #e8edf8;
    --text2: #8a9bbf;
    --text3: #4a5a7a;
    --success: #4ade80;
    --warning: #f59e0b;
    --danger: #f87171;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* Background mesh */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(74,127,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 80% 80%, rgba(126,184,255,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 30% 30% at 60% 30%, rgba(201,169,110,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  #app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

  /* HEADER */
  header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--gold); font-style: italic; }
  .logo-sub { font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 300; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }

  /* NAV TABS */
  nav {
    display: flex;
    gap: 4px;
    padding: 16px 20px 0;
  }
  .tab {
    flex: 1;
    padding: 8px 4px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text3);
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 500;
  }
  .tab:not(.active):hover { border-color: var(--accent); color: var(--accent2); }

  /* MAIN CONTENT */
  main { flex: 1; padding: 16px 20px 100px; }

  /* PANEL */
  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .icon { font-size: 14px; }

  /* FORM ELEMENTS */
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 11px; font-weight: 500; color: var(--text2); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 5px; }

  input, textarea, select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 300;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--bg3); color: var(--text); }
  textarea { resize: none; min-height: 70px; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* TAGS selector */
  .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag {
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg3);
    user-select: none;
  }
  .tag.selected { background: var(--accent); border-color: var(--accent); color: white; }
  .tag.custom-add { border-style: dashed; color: var(--text3); }
  .tag.custom-add:hover { border-color: var(--gold); color: var(--gold); }

  /* RADIO PILLS */
  .pills { display: flex; gap: 6px; }
  .pill {
    flex: 1;
    padding: 9px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    font-size: 13px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }
  .pill.selected { background: var(--accent); border-color: var(--accent); color: white; }

  /* BUTTONS */
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #3a6fe8; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 8px 14px; font-size: 12px; width: auto; }
  .btn-gold { background: var(--gold); color: var(--bg); }

  /* PATIENT CARD */
  .patient-card {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .patient-card:hover { border-color: var(--accent); }
  .patient-card .cic { font-size: 11px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
  .patient-card .name { font-size: 16px; color: var(--text); font-weight: 400; margin: 2px 0; }
  .patient-card .meta { font-size: 12px; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .patient-card .meta span { display: flex; align-items: center; gap: 4px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge-blue { background: rgba(74,127,255,0.15); color: var(--accent2); }
  .badge-green { background: rgba(74,222,128,0.15); color: var(--success); }
  .badge-red { background: rgba(248,113,113,0.15); color: var(--danger); }
  .badge-gold { background: rgba(201,169,110,0.15); color: var(--gold); }

  /* CHAT */
  #chat-section { display: flex; flex-direction: column; height: calc(100dvh - 160px); }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
    scrollbar-width: none;
  }
  .chat-messages::-webkit-scrollbar { display: none; }

  .msg {
    margin-bottom: 12px;
    animation: fadeIn 0.25s ease;
  }
  .msg-ai .bubble {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    max-width: 90%;
  }
  .msg-user { display: flex; justify-content: flex-end; }
  .msg-user .bubble {
    background: var(--accent);
    border-radius: 14px 14px 4px 14px;
    padding: 10px 14px;
    font-size: 14px;
    color: white;
    max-width: 85%;
  }
  .msg-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; }

  .chat-input-wrap {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .chat-input-wrap input {
    flex: 1;
    border-radius: 20px;
    padding: 11px 16px;
  }
  .send-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:hover { background: #3a6fe8; }

  /* LOADING */
  .typing { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text3);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100% { transform:scale(0.6) } 40% { transform:scale(1) } }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--text);
    opacity: 0;
    transition: all 0.3s;
    z-index: 100;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: rgba(10,15,30,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 50;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 4px;
    cursor: pointer;
    transition: color 0.2s;
    color: var(--text3);
    font-size: 10px;
    letter-spacing: 0.5px;
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-item .nav-icon { font-size: 20px; line-height: 1; }
  .nav-item.active { color: var(--accent); }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
  }
  .empty .empty-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
  .empty p { font-size: 13px; }

  /* DETAIL VIEW */
  .detail-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .back-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; }
  .info-value { color: var(--text); text-align: right; max-width: 60%; }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin: 16px 0 8px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="logo">Oftalm<span>IA</span></div>
      <div class="logo-sub">Asistente Clínico</div>
    </div>
    <div class="status-dot"></div>
  </header>

  <main id="main-content">
    <!-- Contenido dinámico -->
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showSection('chat')" id="nav-chat">
      <span class="nav-icon">💬</span>Chat IA
    </button>
    <button class="nav-item" onclick="showSection('pacientes')" id="nav-pacientes">
      <span class="nav-icon">👁</span>Pacientes
    </button>
    <button class="nav-item" onclick="showSection('nuevo')" id="nav-nuevo">
      <span class="nav-icon">＋</span>Añadir
    </button>
    <button class="nav-item" onclick="showSection('buscar')" id="nav-buscar">
      <span class="nav-icon">🔍</span>Buscar
    </button>
  </nav>
</div>

<div id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const API_URL = "https://script.google.com/macros/s/AKfycbx8vMyBP6bBUa8oinsb9b_O9yJV2Tfz-lB0CXccGc7XRSBM--mmgm3kWV_0QXTYjcHQnA/exec";
const API_KEY = "oftalmologia2026";
const CLAUDE_API = "https://api.anthropic.com/v1/messages";

const DIAGNOSTICOS = [
  "Tumor palpebral","Chalazion","Blefaritis","Dermatocalasia","Ptosis",
  "Obstrucción CNL","Entropión","Ectropión","Triquiasis","Parálisis facial",
  "Ptosis ceja","Tumor orbitario","Inflamación orbitaria","Catarata",
  "Uveítis","Úlcera corneal","Absceso corneal","Endoftalmitis","Pterigion"
];
const PROCEDIMIENTOS = [
  "Facoemulsificación","Escisión tumor y reconstrucción",
  "Reinserción aponeurosis vía anterior","Reinserción aponeurosis vía posterior",
  "Mullerectomía","Blefaroplastia superior","Tira tarsal","Cirugía pterigion"
];

let currentSection = 'chat';
let chatHistory = [];
let cachedPacientes = [];
let selectedDiags = [];
let selectedProcs = [];
let customDiags = [];
let customProcs = [];
let currentPatient = null;
let currentEpisode = null;

// ─── API SHEETS ────────────────────────────────────────────
async function sheetsAPI(params) {
  const url = new URL(API_URL);
  url.searchParams.set('key', API_KEY);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  try {
    const r = await fetch(url.toString());
    return await r.json();
  } catch(e) {
    return { error: e.toString() };
  }
}

// ─── TOAST ────────────────────────────────────────────────
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => t.className = '', 2800);
}

// ─── NAVIGATION ───────────────────────────────────────────
function showSection(name) {
  currentSection = name;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navEl = document.getElementById('nav-' + name);
  if (navEl) navEl.classList.add('active');
  const main = document.getElementById('main-content');

  if (name === 'chat') renderChat(main);
  else if (name === 'pacientes') renderPacientes(main);
  else if (name === 'nuevo') renderNuevo(main);
  else if (name === 'buscar') renderBuscar(main);
}

// ─── CHAT ─────────────────────────────────────────────────
function renderChat(main) {
  main.innerHTML = `
    <div id="chat-section">
      <div class="chat-messages" id="chat-msgs">
        <div class="msg msg-ai">
          <div class="msg-label">OftalmIA</div>
          <div class="bubble">Hola. Soy tu asistente clínico. Puedo ayudarte a registrar pacientes, buscar casos, añadir seguimientos o consultar tu base de datos.<br><br>¿En qué te ayudo?</div>
        </div>
        ${chatHistory.map(m => `
          <div class="msg ${m.role === 'user' ? 'msg-user' : 'msg-ai'}">
            ${m.role === 'assistant' ? '<div class="msg-label">OftalmIA</div>' : ''}
            <div class="bubble">${m.content}</div>
          </div>`).join('')}
      </div>
      <div class="chat-input-wrap">
        <input type="text" id="chat-input" placeholder="Escribe tu consulta..." autocomplete="off">
        <button class="send-btn" onclick="sendChat()">➤</button>
      </div>
    </div>`;

  const input = document.getElementById('chat-input');
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
  scrollChat();
}

function scrollChat() {
  const el = document.getElementById('chat-msgs');
  if (el) el.scrollTop = el.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  chatHistory.push({ role: 'user', content: text });
  appendMsg('user', text);

  const typing = appendTyping();

  // Obtener datos actuales para contexto
  const [pacRes, epiRes] = await Promise.all([
    sheetsAPI({ action: 'getPacientes' }),
    sheetsAPI({ action: 'getEpisodios' })
  ]);

  const contextData = `
PACIENTES REGISTRADOS: ${JSON.stringify(pacRes.datos || [])}
EPISODIOS REGISTRADOS: ${JSON.stringify(epiRes.datos || [])}
DIAGNÓSTICOS DISPONIBLES: ${DIAGNOSTICOS.join(', ')}
PROCEDIMIENTOS DISPONIBLES: ${PROCEDIMIENTOS.join(', ')}
FECHA HOY: ${new Date().toLocaleDateString('es-ES')}
  `;

  try {
    const res = await fetch(CLAUDE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Eres OftalmIA, la asistente clínica personal de una oftalmóloga especialista en oculoplastia. Tu rol es ayudarle a gestionar su base de datos de pacientes.

Tienes acceso a los siguientes datos en tiempo real:
${contextData}

Puedes:
- Consultar pacientes por CIC, iniciales, diagnóstico o procedimiento
- Responder preguntas sobre casos registrados
- Guiar a la doctora a usar la app para registrar nuevos pacientes o episodios
- Resumir casos, listar pacientes con cierta patología, etc.

Responde siempre en español, de forma concisa y clínica. Si te preguntan por datos que no están en la base de datos, dilo claramente. No inventes datos. Si la doctora quiere añadir un paciente o episodio nuevo, indícale que use la pestaña "Añadir".`,
        messages: chatHistory.map(m => ({ role: m.role, content: m.content }))
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text || "No he podido procesar tu consulta.";
    typing.remove();
    chatHistory.push({ role: 'assistant', content: reply });
    appendMsg('ai', reply);
  } catch(e) {
    typing.remove();
    appendMsg('ai', 'Error de conexión. Revisa tu conexión a internet.');
  }
  scrollChat();
}

function appendMsg(role, content) {
  const msgs = document.getElementById('chat-msgs');
  if (!msgs) return;
  const div = document.createElement('div');
  div.className = `msg msg-${role === 'user' ? 'user' : 'ai'}`;
  div.innerHTML = `
    ${role === 'ai' ? '<div class="msg-label">OftalmIA</div>' : ''}
    <div class="bubble">${content.replace(/\n/g,'<br>')}</div>`;
  msgs.appendChild(div);
  scrollChat();
}

function appendTyping() {
  const msgs = document.getElementById('chat-msgs');
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML = `<div class="msg-label">OftalmIA</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(div);
  scrollChat();
  return div;
}

// ─── PACIENTES ────────────────────────────────────────────
async function renderPacientes(main) {
  main.innerHTML = `<div class="panel"><div class="panel-title"><span class="icon">👁</span>Cargando pacientes...</div></div>`;
  const res = await sheetsAPI({ action: 'getPacientes' });
  cachedPacientes = res.datos || [];

  if (!cachedPacientes.length) {
    main.innerHTML = `<div class="empty"><div class="empty-icon">🗂</div><p>No hay pacientes registrados aún</p></div>`;
    return;
  }

  main.innerHTML = `
    <div class="panel-title" style="margin-bottom:12px"><span class="icon">👁</span>${cachedPacientes.length} paciente${cachedPacientes.length !== 1 ? 's' : ''}</div>
    ${cachedPacientes.map(p => `
      <div class="patient-card" onclick="showPatientDetail('${p.CIC}')">
        <div class="cic">CIC ${p.CIC}</div>
        <div class="name">${p.Iniciales}</div>
        <div class="meta">
          <span>🎂 ${p.Edad} años</span>
          <span>📅 ${p['Fecha Registro']}</span>
        </div>
      </div>`).join('')}`;
}

async function showPatientDetail(cic) {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="panel"><p style="color:var(--text3)">Cargando...</p></div>`;

  const [pacRes, epiRes] = await Promise.all([
    sheetsAPI({ action: 'getPacientes', cic }),
    sheetsAPI({ action: 'getEpisodios', cic })
  ]);

  const pac = (pacRes.datos || [])[0];
  const episodios = epiRes.datos || [];
  if (!pac) { toast('Paciente no encontrado', 'error'); showSection('pacientes'); return; }

  main.innerHTML = `
    <div class="detail-header">
      <button class="back-btn" onclick="showSection('pacientes')">← Volver</button>
      <div style="flex:1">
        <div style="font-family:'DM Serif Display',serif;font-size:18px">${pac.Iniciales}</div>
        <div style="font-size:11px;color:var(--text3)">CIC ${pac.CIC}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><span class="icon">👤</span>Datos del paciente</div>
      <div class="info-row"><span class="info-label">CIC</span><span class="info-value">${pac.CIC}</span></div>
      <div class="info-row"><span class="info-label">Iniciales</span><span class="info-value">${pac.Iniciales}</span></div>
      <div class="info-row"><span class="info-label">Edad</span><span class="info-value">${pac.Edad} años</span></div>
      <div class="info-row"><span class="info-label">Registro</span><span class="info-value">${pac['Fecha Registro']}</span></div>
    </div>

    <div class="section-label">Episodios (${episodios.length})</div>
    ${episodios.length === 0 ? `<div class="empty"><div class="empty-icon">📋</div><p>Sin episodios registrados</p></div>` :
      episodios.map(ep => `
        <div class="patient-card" onclick="showEpisodeDetail('${ep.ID_episodio}')">
          <div class="cic">${ep.ID_episodio}</div>
          <div class="name" style="font-size:14px">${ep.Diagnosticos || '—'}</div>
          <div class="meta">
            <span>👁 ${ep.Ojo || '—'}</span>
            <span>🔪 ${ep['Fecha Cirugia'] || 'Sin fecha cirugía'}</span>
            ${ep.Complicaciones === 'Sí' ? `<span class="badge badge-red">⚠ Complicación</span>` : ''}
            ${ep.Reintervencion === 'Sí' ? `<span class="badge badge-gold">↩ Reintervención</span>` : ''}
          </div>
        </div>`).join('')}

    <div style="margin-top:12px">
      <button class="btn btn-ghost" onclick="showAddEpisodio('${pac.CIC}','${pac.Iniciales}')">+ Añadir episodio</button>
    </div>`;
}

async function showEpisodeDetail(idEpisodio) {
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="panel"><p style="color:var(--text3)">Cargando...</p></div>`;

  const [epiRes, segRes] = await Promise.all([
    sheetsAPI({ action: 'getEpisodios' }),
    sheetsAPI({ action: 'getSeguimientos', id_episodio: idEpisodio })
  ]);

  const ep = (epiRes.datos || []).find(e => e.ID_episodio === idEpisodio);
  const segs = segRes.datos || [];
  if (!ep) { toast('Episodio no encontrado', 'error'); return; }

  main.innerHTML = `
    <div class="detail-header">
      <button class="back-btn" onclick="showPatientDetail('${ep.CIC}')">← Volver</button>
      <div style="flex:1">
        <div style="font-family:'DM Serif Display',serif;font-size:16px">${ep.Diagnosticos || 'Episodio'}</div>
        <div style="font-size:11px;color:var(--text3)">${ep.ID_episodio}</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title"><span class="icon">📋</span>Episodio clínico</div>
      <div class="info-row"><span class="info-label">Paciente</span><span class="info-value">${ep.Iniciales} (CIC ${ep.CIC})</span></div>
      <div class="info-row"><span class="info-label">Ojo</span><span class="info-value">${ep.Ojo || '—'}</span></div>
      <div class="info-row"><span class="info-label">Diagnósticos</span><span class="info-value">${ep.Diagnosticos || '—'}</span></div>
      <div class="info-row"><span class="info-label">Procedimientos</span><span class="info-value">${ep.Procedimientos || '—'}</span></div>
      <div class="info-row"><span class="info-label">Inclusión quirúrgica</span><span class="info-value">${ep['Fecha Inclusion Quirurgica'] || '—'}</span></div>
      <div class="info-row"><span class="info-label">Fecha cirugía</span><span class="info-value">${ep['Fecha Cirugia'] || '—'}</span></div>
      <div class="info-row"><span class="info-label">Complicaciones</span><span class="info-value">${ep.Complicaciones === 'Sí' ? `<span class="badge badge-red">Sí: ${ep['Descripcion Complicacion'] || ''}</span>` : '<span class="badge badge-green">No</span>'}</span></div>
      <div class="info-row"><span class="info-label">Reintervención</span><span class="info-value">${ep.Reintervencion === 'Sí' ? '<span class="badge badge-gold">Sí</span>' : '<span class="badge badge-green">No</span>'}</span></div>
      ${ep['Google Drive URL'] ? `<div class="info-row"><span class="info-label">Imágenes</span><span class="info-value"><a href="${ep['Google Drive URL']}" target="_blank" style="color:var(--accent2)">Ver en Drive</a></span></div>` : ''}
    </div>

    <div class="section-label">Seguimientos (${segs.length})</div>
    ${segs.length === 0 ? `<div class="empty"><div class="empty-icon">📅</div><p>Sin seguimientos registrados</p></div>` :
      segs.map(s => `
        <div class="panel" style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:12px;color:var(--accent2)">${s['Fecha Visita']}</span>
            <span style="font-size:11px;color:var(--text3)">${s.ID_seguimiento}</span>
          </div>
          <div style="font-size:13px;color:var(--text);line-height:1.5">${s.Notas || '—'}</div>
        </div>`).join('')}

    <button class="btn btn-ghost" style="margin-top:8px" onclick="showAddSeguimiento('${ep.ID_episodio}','${ep.CIC}')">+ Añadir seguimiento</button>`;
}

// ─── AÑADIR ───────────────────────────────────────────────
function renderNuevo(main) {
  selectedDiags = []; selectedProcs = []; customDiags = []; customProcs = [];

  main.innerHTML = `
    <div class="panel">
      <div class="panel-title"><span class="icon">👤</span>Nuevo paciente</div>
      <div class="row2">
        <div class="field"><label>CIC</label><input type="text" id="n-cic" placeholder="12345678"></div>
        <div class="field"><label>Iniciales</label><input type="text" id="n-ini" placeholder="A.B.C." maxlength="10"></div>
      </div>
      <div class="field"><label>Edad</label><input type="number" id="n-edad" placeholder="45" min="0" max="120"></div>
      <button class="btn btn-primary" onclick="submitPaciente()">Registrar paciente</button>
    </div>

    <div class="panel">
      <div class="panel-title"><span class="icon">🔪</span>Nuevo episodio clínico</div>
      <div class="row2">
        <div class="field"><label>CIC paciente</label><input type="text" id="e-cic" placeholder="12345678"></div>
        <div class="field"><label>Iniciales</label><input type="text" id="e-ini" placeholder="A.B.C." maxlength="10"></div>
      </div>

      <div class="field">
        <label>Ojo</label>
        <div class="pills">
          <div class="pill" onclick="selectPill(this,'ojo')" data-val="OD">OD</div>
          <div class="pill" onclick="selectPill(this,'ojo')" data-val="OI">OI</div>
          <div class="pill" onclick="selectPill(this,'ojo')" data-val="AO">AO</div>
        </div>
      </div>

      <div class="row2">
        <div class="field"><label>Inclusión quirúrgica</label><input type="date" id="e-inclusion"></div>
        <div class="field"><label>Fecha cirugía</label><input type="date" id="e-cirugia"></div>
      </div>

      <div class="field">
        <label>Diagnósticos</label>
        <div class="tags-wrap" id="diag-tags">
          ${DIAGNOSTICOS.map(d => `<div class="tag" onclick="toggleTag(this,'diag')">${d}</div>`).join('')}
          <div class="tag custom-add" onclick="addCustomTag('diag')">+ Otro</div>
        </div>
      </div>

      <div class="field">
        <label>Procedimientos</label>
        <div class="tags-wrap" id="proc-tags">
          ${PROCEDIMIENTOS.map(p => `<div class="tag" onclick="toggleTag(this,'proc')">${p}</div>`).join('')}
          <div class="tag custom-add" onclick="addCustomTag('proc')">+ Otro</div>
        </div>
      </div>

      <div class="field">
        <label>Complicaciones</label>
        <div class="pills">
          <div class="pill" onclick="selectPill(this,'comp')" data-val="No">No</div>
          <div class="pill" onclick="selectPill(this,'comp')" data-val="Sí">Sí</div>
        </div>
      </div>
      <div class="field hidden" id="comp-desc-wrap">
        <label>Descripción complicación</label>
        <textarea id="e-comp-desc" placeholder="Describe la complicación..."></textarea>
      </div>

      <div class="field">
        <label>Reintervención necesaria</label>
        <div class="pills">
          <div class="pill" onclick="selectPill(this,'reint')" data-val="No">No</div>
          <div class="pill" onclick="selectPill(this,'reint')" data-val="Sí">Sí</div>
        </div>
      </div>

      <div class="field">
        <label>URL Google Drive (imágenes)</label>
        <input type="url" id="e-drive" placeholder="https://drive.google.com/...">
      </div>

      <button class="btn btn-primary" onclick="submitEpisodio()">Registrar episodio</button>
    </div>`;
}

function toggleTag(el, type) {
  el.classList.toggle('selected');
  const val = el.textContent;
  if (type === 'diag') {
    if (el.classList.contains('selected')) selectedDiags.push(val);
    else selectedDiags = selectedDiags.filter(d => d !== val);
  } else {
    if (el.classList.contains('selected')) selectedProcs.push(val);
    else selectedProcs = selectedProcs.filter(p => p !== val);
  }
}

function addCustomTag(type) {
  const val = prompt(type === 'diag' ? 'Diagnóstico personalizado:' : 'Procedimiento personalizado:');
  if (!val || !val.trim()) return;
  const v = val.trim();
  const wrap = document.getElementById(type === 'diag' ? 'diag-tags' : 'proc-tags');
  const addBtn = wrap.querySelector('.custom-add');
  const tag = document.createElement('div');
  tag.className = 'tag selected';
  tag.textContent = v;
  tag.onclick = function() { toggleTag(this, type); };
  wrap.insertBefore(tag, addBtn);
  if (type === 'diag') selectedDiags.push(v);
  else selectedProcs.push(v);
}

let pillState = { ojo: null, comp: null, reint: null };
function selectPill(el, group) {
  document.querySelectorAll(`.pill[onclick*="${group}"]`).forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  pillState[group] = el.dataset.val;
  if (group === 'comp') {
    document.getElementById('comp-desc-wrap').classList.toggle('hidden', el.dataset.val !== 'Sí');
  }
}

async function submitPaciente() {
  const cic = document.getElementById('n-cic').value.trim();
  const ini = document.getElementById('n-ini').value.trim();
  const edad = document.getElementById('n-edad').value.trim();
  if (!cic || !ini || !edad) { toast('Completa todos los campos', 'error'); return; }
  const res = await sheetsAPI({ action: 'addPaciente', cic, iniciales: ini, edad });
  if (res.ok) { toast('Paciente registrado ✓', 'success'); document.getElementById('n-cic').value = ''; document.getElementById('n-ini').value = ''; document.getElementById('n-edad').value = ''; }
  else toast('Error: ' + (res.error || 'desconocido'), 'error');
}

async function submitEpisodio() {
  const cic = document.getElementById('e-cic').value.trim();
  const ini = document.getElementById('e-ini').value.trim();
  if (!cic || !ini) { toast('CIC e iniciales son obligatorios', 'error'); return; }
  if (!selectedDiags.length) { toast('Selecciona al menos un diagnóstico', 'error'); return; }

  const params = {
    action: 'addEpisodio',
    cic, iniciales: ini,
    ojo: pillState.ojo || '',
    fechaInclusion: document.getElementById('e-inclusion').value,
    fechaCirugia: document.getElementById('e-cirugia').value,
    diagnosticos: selectedDiags.join(', '),
    procedimientos: selectedProcs.join(', '),
    complicaciones: pillState.comp || 'No',
    descripcionComplicacion: document.getElementById('e-comp-desc')?.value || '',
    reintervencion: pillState.reint || 'No',
    driveUrl: document.getElementById('e-drive').value
  };

  const res = await sheetsAPI(params);
  if (res.ok) {
    toast('Episodio registrado ✓', 'success');
    selectedDiags = []; selectedProcs = []; pillState = { ojo: null, comp: null, reint: null };
    renderNuevo(document.getElementById('main-content'));
  } else toast('Error: ' + (res.error || 'desconocido'), 'error');
}

function showAddEpisodio(cic, ini) {
  showSection('nuevo');
  setTimeout(() => {
    const cicEl = document.getElementById('e-cic');
    const iniEl = document.getElementById('e-ini');
    if (cicEl) cicEl.value = cic;
    if (iniEl) iniEl.value = ini;
  }, 100);
}

function showAddSeguimiento(idEpisodio, cic) {
  const main = document.getElementById('main-content');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  main.innerHTML = `
    <div class="detail-header">
      <button class="back-btn" onclick="showEpisodeDetail('${idEpisodio}')">← Volver</button>
      <div style="font-family:'DM Serif Display',serif;font-size:16px">Nuevo seguimiento</div>
    </div>
    <div class="panel">
      <div class="field"><label>ID Episodio</label><input type="text" id="s-ep" value="${idEpisodio}" readonly style="opacity:0.5"></div>
      <div class="field"><label>Fecha visita</label><input type="date" id="s-fecha"></div>
      <div class="field"><label>Notas clínicas</label><textarea id="s-notas" placeholder="Evolución, hallazgos, plan..." style="min-height:100px"></textarea></div>
      <button class="btn btn-primary" onclick="submitSeguimiento('${idEpisodio}','${cic}')">Registrar seguimiento</button>
    </div>`;

  document.getElementById('s-fecha').value = new Date().toISOString().split('T')[0];
}

async function submitSeguimiento(idEpisodio, cic) {
  const fecha = document.getElementById('s-fecha').value;
  const notas = document.getElementById('s-notas').value.trim();
  if (!notas) { toast('Añade notas clínicas', 'error'); return; }
  const fechaFormatted = fecha ? new Date(fecha).toLocaleDateString('es-ES') : '';
  const res = await sheetsAPI({ action: 'addSeguimiento', id_episodio: idEpisodio, cic, fechaVisita: fechaFormatted, notas });
  if (res.ok) { toast('Seguimiento registrado ✓', 'success'); showEpisodeDetail(idEpisodio); }
  else toast('Error: ' + (res.error || 'desconocido'), 'error');
}

// ─── BUSCAR ───────────────────────────────────────────────
function renderBuscar(main) {
  main.innerHTML = `
    <div class="panel">
      <div class="panel-title"><span class="icon">🔍</span>Buscar pacientes</div>
      <div class="field"><label>Por CIC</label><input type="text" id="b-cic" placeholder="Número CIC"></div>
      <div class="field"><label>Por diagnóstico</label>
        <select id="b-diag">
          <option value="">— Todos —</option>
          ${DIAGNOSTICOS.map(d => `<option>${d}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Por procedimiento</label>
        <select id="b-proc">
          <option value="">— Todos —</option>
          ${PROCEDIMIENTOS.map(p => `<option>${p}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary" onclick="runBuscar()">Buscar</button>
    </div>
    <div id="buscar-results"></div>`;
}

async function runBuscar() {
  const cic = document.getElementById('b-cic').value.trim();
  const diag = document.getElementById('b-diag').value;
  const proc = document.getElementById('b-proc').value;

  const res = document.getElementById('buscar-results');
  res.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text3)">Buscando...</div>`;

  const params = { action: 'getEpisodios' };
  if (cic) params.cic = cic;
  if (diag) params.diagnostico = diag;
  if (proc) params.procedimiento = proc;

  const r = await sheetsAPI(params);
  const datos = r.datos || [];

  if (!datos.length) {
    res.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Sin resultados</p></div>`;
    return;
  }

  res.innerHTML = `
    <div class="section-label">${datos.length} resultado${datos.length !== 1 ? 's' : ''}</div>
    ${datos.map(ep => `
      <div class="patient-card" onclick="showEpisodeDetail('${ep.ID_episodio}')">
        <div class="cic">CIC ${ep.CIC} · ${ep.Iniciales}</div>
        <div class="name" style="font-size:14px">${ep.Diagnosticos || '—'}</div>
        <div class="meta">
          <span>👁 ${ep.Ojo || '—'}</span>
          <span>🔪 ${ep['Fecha Cirugia'] || '—'}</span>
          ${ep.Procedimientos ? `<span class="badge badge-blue">${ep.Procedimientos.split(',')[0]}</span>` : ''}
        </div>
      </div>`).join('')}`;
}

// ─── INIT ─────────────────────────────────────────────────
showSection('chat');
</script>
</body>
</html>
